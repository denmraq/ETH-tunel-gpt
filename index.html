<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071521"><title>ETH Tunnel</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script><style>
:root{--bg:#07111b;--card:#0e1b28;--line:#1b3042;--text:#eef7ff;--muted:#8fa6b8;--green:#2ee59d;--red:#ff6675;--blue:#4db8ff;--cyan:#65e6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111b,#091725);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.logo{width:48px;height:48px}.title{font-weight:900;font-size:22px}.sub{color:var(--muted);font-size:12px}.card{background:rgba(14,27,40,.96);border:1px solid var(--line);border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 16px 40px #0004}.price{font-size:48px;font-weight:950}.signal{font-size:30px;font-weight:950;margin-top:7px}.long{color:var(--green)}.short{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.h{padding:14px;border:1px solid var(--line);border-radius:18px;text-align:center}.hk{font-size:12px;color:var(--muted)}.hv{font-size:22px;font-weight:900;margin:5px 0}.prob{font-size:13px}.chart{height:430px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fact{background:#0a1723;border-radius:16px;padding:13px}.fk{color:var(--muted);font-size:11px}.fv{font-weight:850;margin-top:4px}.rotation{font-size:17px;font-weight:850}.bar{height:8px;background:#152838;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,var(--red),var(--blue),var(--green));width:50%}.btn{width:100%;border:0;border-radius:16px;padding:14px;background:#173047;color:#fff;font-weight:850;font-size:15px}.status{color:var(--muted);font-size:12px;text-align:center;margin:12px}.warn{color:#ffd27a;font-size:12px;margin-top:8px;display:none}@media(max-width:600px){.wrap{padding:12px}.card{padding:16px;border-radius:20px}.price{font-size:42px}.grid{gap:6px}.h{padding:11px 5px}.hv{font-size:18px}.chart{height:390px}}
</style></head><body><div class="wrap"><div class="head"><img class="logo" src="icon.svg"><div><div class="title">ETH ADAPTIVE TUNNEL</div><div class="sub">RADAR STATE → CAPITAL REGIME → MATHEMATICAL TRAJECTORY</div></div></div>
<div class="card"><div class="sub">ETH/USDT · СЕЙЧАС</div><div id="price" class="price">—</div><div id="signal" class="signal">Загрузка…</div><div id="state" class="sub"></div></div>
<div class="card"><div class="grid"><div class="h"><div class="hk">4 ЧАСА · P50</div><div id="p4" class="hv">—</div><div id="q4" class="prob">—</div></div><div class="h"><div class="hk">12 ЧАСОВ · P50</div><div id="p12" class="hv">—</div><div id="q12" class="prob">—</div></div><div class="h"><div class="hk">24 ЧАСА · P50</div><div id="p24" class="hv">—</div><div id="q24" class="prob">—</div></div></div></div>
<div class="card"><div class="sub">ТУННЕЛЬ P20 · P50 · P80</div><div id="chart" class="chart"></div></div>
<div class="card"><div class="rotation" id="rotation">Режим капитала: —</div><div class="bar"><div id="rotbar" class="fill"></div></div><div class="facts"><div class="fact"><div class="fk">BTC DOMINANCE</div><div id="dom" class="fv">—</div></div><div class="fact"><div class="fk">ETH/BTC</div><div id="ethbtc" class="fv">—</div></div><div class="fact"><div class="fk">BTC</div><div id="btc" class="fv">—</div></div><div class="fact"><div class="fk">OI + TAKER FLOW</div><div id="flow" class="fv">—</div></div></div><div id="warn" class="warn"></div></div>
<button id="refresh" class="btn">↻ Обновить сейчас</button><div id="status" class="status"></div></div><script>
const F='https://fapi.binance.com',S='https://api.binance.com',CG='https://api.coingecko.com/api/v3';const $=x=>document.getElementById(x),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),avg=a=>a.reduce((s,x)=>s+x,0)/Math.max(1,a.length);function fmt(x){return Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}async function jf(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function opt(u){try{return await jf(u)}catch{return null}}async function kl(s,i,n){try{return await jf(`${F}/fapi/v1/klines?symbol=${s}&interval=${i}&limit=${n}`)}catch{return jf(`${S}/api/v3/klines?symbol=${s}&interval=${i}&limit=${n}`)}}
const closes=k=>k.map(x=>+x[4]);function ema(a,n){let q=2/(n+1),e=a[0];for(let i=1;i<a.length;i++)e=q*a[i]+(1-q)*e;return e}function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+(g/n)/(l/n)):100}function atr(k,n=14){let z=[];for(let i=k.length-n;i<k.length;i++){let h=+k[i][2],l=+k[i][3],p=+k[i-1][4];z.push(Math.max(h-l,Math.abs(h-p),Math.abs(l-p)))}return avg(z)}function tf(k){let a=closes(k),e6=ema(a,6),e20=ema(a,20);return clamp((e6-e20)/(e20*.004),-1,1)}function structure(k,p){let a=k.slice(-20),hi=Math.max(...a.map(x=>+x[2])),lo=Math.min(...a.map(x=>+x[3]));return clamp(((p-lo)/(hi-lo)-.5)*2,-1,1)}function mom(k){let a=closes(k),roc=(a.at(-1)/a.at(-11)-1)/.01,rv=(rsi(a)-50)/25;return clamp(clamp(roc,-1,1)*.7+clamp(rv,-1,1)*.3,-1,1)}function taker(k,n=20){let b=0,t=0;for(let x of k.slice(-n)){b+=+x[10]||0;t+=+x[7]||0}return t?clamp(((b/t)-.5)*4,-1,1):0}function sd(a){let m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))}function erf(x){let s=x<0?-1:1;x=Math.abs(x);let t=1/(1+.3275911*x),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}function cdf(z){return .5*(1+erf(z/Math.sqrt(2)))}
async function dominance(){let g=await opt(`${CG}/global`);if(!g?.data?.market_cap_percentage?.btc)return null;return +g.data.market_cap_percentage.btc}async function build(){let [m1,m5,m15,h1,h4,ethbtc,btc,oi,fund,dom]=await Promise.all([kl('ETHUSDT','1m',90),kl('ETHUSDT','5m',90),kl('ETHUSDT','15m',180),kl('ETHUSDT','1h',500),kl('ETHUSDT','4h',120),kl('ETHBTC','1h',72),kl('BTCUSDT','1h',72),opt(`${F}/futures/data/openInterestHist?symbol=ETHUSDT&period=15m&limit=8`),opt(`${F}/fapi/v1/premiumIndex?symbol=ETHUSDT`),dominance()]);let p=+m1.at(-1)[4],A=atr(h1),trend=clamp(tf(m15)*.20+tf(h1)*.35+tf(h4)*.45,-1,1),st=structure(h1,p),mo=mom(m15),f15=taker(m15),fast=tf(m1);let oiPct=null,oiComp=0;if(oi?.length>=3){let a=+oi[0].sumOpenInterest,b=+oi.at(-1).sumOpenInterest;if(a>0){oiPct=(b/a-1)*100;let pr=closes(m15),prc=pr.at(-1)/pr.at(-7)-1;oiComp=prc>=0?(oiPct>=0?1:.4):(oiPct>=0?-1:-.4)}}let funding=fund?+fund.lastFundingRate*100:null,fundComp=funding==null?0:clamp(-funding/.05,-1,1),flow=clamp(oiComp*.45+f15*.40+fundComp*.15,-1,1);let liq=clamp((p-ema(closes(h1),20))/(A*2),-1,1);let raw=trend*.22+st*.22+mo*.20+flow*.20+liq*.16,pressure=clamp(50+raw*50,1,99),dir=pressure>=50?'LONG':'SHORT',conf=dir==='LONG'?pressure:100-pressure;
let a15=closes(m15),rn=a15.at(-1)/a15.at(-11)-1,rp=a15.at(-2)/a15.at(-12)-1,decel=Math.abs(rn)<Math.abs(rp)*.6,ext=Math.abs(p-ema(closes(h1),20))/A,time=decel&&ext>1.2?'LATE':(!decel&&ext<.8?'FRESH':'DEVELOPING');
let eb=closes(ethbtc),bb=closes(btc),er=eb.at(-1)/eb.at(-25)-1,br=bb.at(-1)/bb.at(-25)-1;/* dominance is contextual: level is displayed, while direction uses relative ETH/BTC + BTC because free global endpoint has no reliable intraday history */let rot=clamp((er/.025)*.65+(br/.04)*.35,-1,1);let aligned=(dir==='LONG'?1:-1)*rot;let age=time==='FRESH'?1:time==='DEVELOPING'?.78:.48;let quality=clamp((conf-50)/42,0,1);let force=clamp(.45+.55*quality,0,1)*age*clamp(1+.22*aligned,.72,1.28);
let rets=[];for(let i=h1.length-120;i<h1.length;i++)if(i>0)rets.push(Math.log(+h1[i][4]/+h1[i-1][4]));let sig=sd(rets),sign=dir==='LONG'?1:-1;let H=[4,12,24],targets={},bands={},probs={};for(let h of H){let distance=A*Math.sqrt(h)*force;let med=p+sign*distance;let s=p*sig*Math.sqrt(h);let z=.841621233;targets[h]=med;bands[h]={p20:med-z*s,p50:med,p80:med+z*s};let pr=cdf((med-p)/Math.max(1e-9,s));probs[h]=dir==='LONG'?pr:1-pr}
return {p,A,dir,conf,time,trend,st,mo,flow,fast,oiPct,funding,dom,er,br,rot,targets,bands,probs,h1}}
let chart;function draw(s){$('chart').innerHTML='';chart=LightweightCharts.createChart($('chart'),{width:$('chart').clientWidth,height:$('chart').clientHeight,layout:{background:{color:'#0e1b28'},textColor:'#8fa6b8'},grid:{vertLines:{color:'#152838'},horzLines:{color:'#152838'}},timeScale:{timeVisible:true}});let hist=chart.addLineSeries({lineWidth:2});hist.setData(s.h1.slice(-72).map(x=>({time:Math.floor(+x[0]/1000),value:+x[4]})));let now=Math.floor(Date.now()/1000),step=4*3600;let p50=chart.addLineSeries({lineWidth:3,lineStyle:0}),p20=chart.addLineSeries({lineWidth:1,lineStyle:2}),p80=chart.addLineSeries({lineWidth:1,lineStyle:2});let base={time:now,value:s.p};p50.setData([base,...[4,12,24].map(h=>({time:now+h*3600,value:s.bands[h].p50}))]);p20.setData([base,...[4,12,24].map(h=>({time:now+h*3600,value:s.bands[h].p20}))]);p80.setData([base,...[4,12,24].map(h=>({time:now+h*3600,value:s.bands[h].p80}))]);chart.timeScale().fitContent()}
function render(s){$('price').textContent=fmt(s.p);$('signal').className='signal '+(s.dir==='LONG'?'long':'short');$('signal').textContent=`${s.dir==='LONG'?'🟢':'🔴'} ${s.dir} · ${s.conf.toFixed(1)}%`;$('state').textContent=`TIME ENGINE: ${s.time} · направление берётся из мотора радара`;for(let h of [4,12,24]){$('p'+h).textContent=fmt(s.targets[h]);$('q'+h).textContent=`${s.dir} ${(s.probs[h]*100).toFixed(1)}% · P20 ${fmt(s.bands[h].p20)} · P80 ${fmt(s.bands[h].p80)}`}$('dom').textContent=s.dom==null?'нет данных':s.dom.toFixed(2)+'%';$('ethbtc').textContent=(s.er>=0?'↑ ':'↓ ')+(s.er*100).toFixed(2)+'% / 24ч';$('btc').textContent=(s.br>=0?'↑ ':'↓ ')+(s.br*100).toFixed(2)+'% / 24ч';$('flow').textContent=`FLOW ${s.flow>=0?'+':''}${s.flow.toFixed(2)} · OI ${s.oiPct==null?'—':(s.oiPct>=0?'+':'')+s.oiPct.toFixed(2)+'%'}`;let txt=s.rot>.18?'ротация поддерживает ETH':s.rot<-.18?'режим капитала давит на ETH':'нейтральный';$('rotation').textContent='Режим капитала: '+txt;$('rotbar').style.width=(50+s.rot*45)+'%';let w=[];if(s.dom==null)w.push('BTC.D недоступна');$('warn').style.display=w.length?'block':'none';$('warn').textContent=w.length?'⚠️ '+w.join(' · '):'';draw(s);$('status').textContent='Обновлено '+new Date().toLocaleTimeString()}
async function load(){let b=$('refresh');b.disabled=true;b.textContent='↻ Считаю…';try{render(await build())}catch(e){$('status').textContent='Ошибка данных: '+e.message}finally{b.disabled=false;b.textContent='↻ Обновить сейчас'}}$('refresh').onclick=load;addEventListener('resize',()=>{});load();
</script></body></html>
