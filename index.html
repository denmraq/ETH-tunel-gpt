<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg"><title>ETH Adaptive Tunnel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#eef4ff;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#8f9bad}.price{font-size:36px;font-weight:800}.sig{font-size:24px;font-weight:800}.long{color:#32dc91}.short{color:#ff6572}.card{background:#121a27;border:1px solid #263247;border-radius:16px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.h{background:#0d1420;border-radius:12px;padding:11px}.h b{font-size:19px}.small{font-size:12px;color:#9aa7ba}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fact{background:#0d1420;border-radius:10px;padding:10px}.fact b{display:block;margin-top:4px}canvas{width:100%;height:330px;background:#0d1420;border-radius:12px}button{background:#1c2940;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.warn{color:#ffc966;margin-top:8px}@media(max-width:560px){.grid{grid-template-columns:1fr}.price{font-size:32px}canvas{height:300px}}</style></head><body><div class="wrap"><div class="top"><div><div class="small">ETH / USDT · ADAPTIVE PROBABILITY TUNNEL</div><div id="price" class="price">—</div></div><button onclick="load()">↻ Обновить</button></div><div id="signal" class="sig">Считаю…</div><div id="state" class="muted"></div>
<div class="card"><canvas id="chart"></canvas></div>
<div class="card"><div class="grid"><div class="h"><div class="small">4 ЧАСА · P50</div><b id="p4">—</b><div id="q4" class="small"></div></div><div class="h"><div class="small">12 ЧАСОВ · P50</div><b id="p12">—</b><div id="q12" class="small"></div></div><div class="h"><div class="small">24 ЧАСА · P50</div><b id="p24">—</b><div id="q24" class="small"></div></div></div></div>
<div class="card"><div class="facts"><div class="fact"><span class="small">ETH/BTC</span><b id="ethbtc">—</b></div><div class="fact"><span class="small">OI + TAKER FLOW</span><b id="flow">—</b></div><div class="fact"><span class="small">ETH 50D / 200D</span><b id="regime">—</b></div><div class="fact"><span class="small">ГРАНИЦЫ ТУННЕЛЯ</span><b id="liq">—</b></div><div class="fact"><span class="small">VOLATILITY</span><b id="volstate">—</b></div><div class="fact"><span class="small">РЕЖИМ</span><b id="marketmode">—</b></div></div><div id="rotation" style="margin-top:10px"></div><div id="warn" class="warn"></div></div>

<div id="status" class="small"></div></div>
<script>
const F='https://fapi.binance.com',S='https://api.binance.com';
const $=x=>document.getElementById(x),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const fmt=x=>Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
async function jf(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()} async function opt(u){try{return await jf(u)}catch{return null}}
async function fkl(sym,int,n){return jf(`${F}/fapi/v1/klines?symbol=${sym}&interval=${int}&limit=${n}`)}
async function skl(sym,int,n){return jf(`${S}/api/v3/klines?symbol=${sym}&interval=${int}&limit=${n}`)}
const closes=k=>k.map(x=>+x[4]); function ema(a,n){let q=2/(n+1),e=a[0];for(let i=1;i<a.length;i++)e=q*a[i]+(1-q)*e;return e} function atr(k,n=14){let z=[];for(let i=k.length-n;i<k.length;i++){let h=+k[i][2],l=+k[i][3],p=+k[i-1][4];z.push(Math.max(h-l,Math.abs(h-p),Math.abs(l-p)))}return avg(z)}
function sd(a){let m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))} function logrets(a){let r=[];for(let i=1;i<a.length;i++)r.push(Math.log(a[i]/a[i-1]));return r}
function bias(k){let a=closes(k),e6=ema(a,6),e20=ema(a,20);return clamp((e6-e20)/(e20*.004),-1,1)}
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+(g/n)/(l/n)):100}
function momentum(k){let a=closes(k),roc=(a.at(-1)/a.at(-11)-1)/.01,rv=(rsi(a)-50)/25;return clamp(clamp(roc,-1,1)*.7+clamp(rv,-1,1)*.3,-1,1)}
function taker(k,n=20){let b=0,t=0;for(let x of k.slice(-n)){b+=+x[10]||0;t+=+x[7]||0}return t?clamp(((b/t)-.5)*4,-1,1):0}
function closed(k){let now=Date.now();return k.filter(x=>+x[6]<now)}
function phi(x){let t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=1-d*t*(.319381530+t*(-.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return x>=0?p:1-p}
function integrate(a,tau,h){return a*tau*(1-Math.exp(-h/tau))}
async function compute(){
 let [m1,m5,m15,h1,h4,d1,eb,oi,fund]=await Promise.all([fkl('ETHUSDT','1m',90),fkl('ETHUSDT','5m',288),fkl('ETHUSDT','15m',220),fkl('ETHUSDT','1h',760),fkl('ETHUSDT','4h',180),fkl('ETHUSDT','1d',260),skl('ETHBTC','1h',80),opt(`${F}/futures/data/openInterestHist?symbol=ETHUSDT&period=15m&limit=32`),opt(`${F}/fapi/v1/premiumIndex?symbol=ETHUSDT`)]);
 let c15=closed(m15),c1=closed(h1),c4=closed(h4),cd=closes(closed(d1)),anchor=+c15.at(-1)[4],anchorTime=+c15.at(-1)[6],live=+m1.at(-1)[4],A=atr(c1),r1=logrets(closes(c1)),vol1=Math.max(sd(r1.slice(-169)),.001);
 // Smooth ETH geometry: regression slopes on CLOSED hourly data. 15m is anchor only, not the directional motor.
 function slopeLog(a,n){let y=a.slice(-n).map(Math.log),xm=(n-1)/2,ym=avg(y),num=0,den=0;for(let i=0;i<n;i++){num+=(i-xm)*(y[i]-ym);den+=(i-xm)**2}return den?num/den:0}
 let hc=closes(c1),sFast=slopeLog(hc,6),sSlow=slopeLog(hc,13),sPrev=slopeLog(hc.slice(0,-3),13),acc=(sSlow-sPrev)/3;
 let scale=Math.max(vol1,.0015),aFast=clamp(sFast+acc*.8,-1.15*scale,1.15*scale),aSlow=clamp(sSlow+acc*.5,-.85*scale,.85*scale);
 // 50D/200D: slow regime. It affects direction only when geometry is materially displaced/aligned.
 let ma50=avg(cd.slice(-50)),ma200=avg(cd.slice(-200)),ma50p=avg(cd.slice(-55,-5)),ma200p=avg(cd.slice(-205,-5)),rd=logrets(cd),dvol=Math.max(sd(rd.slice(-120)),.005);
 let d50=Math.log(anchor/ma50)/dvol,d200=Math.log(anchor/ma200)/dvol,s50=Math.log(ma50/ma50p)/5/dvol,s200=Math.log(ma200/ma200p)/5/dvol;
 let aligned=(Math.sign(d50)===Math.sign(s50)&&Math.sign(d200)===Math.sign(s200));
 let longRaw=(clamp(d50/5,-1,1)+clamp(d200/8,-1,1)+clamp(s50*7,-1,1)+clamp(s200*10,-1,1))/4;
 let longReg=Math.abs(longRaw)>.28||aligned?clamp(longRaw,-1,1):0,aLong=scale*longReg*.16;
 // ETH/BTC is a conditional modifier, not a permanent vote. Ignore ordinary noise.
 let ec=closes(closed(eb)),er4=ec.at(-1)/ec.at(-5)-1,er24=ec.at(-1)/ec.at(-25)-1,rel=0;
 if(Math.sign(er4)===Math.sign(er24)&&Math.abs(er4)>=.004&&Math.abs(er24)>=.010) rel=clamp(er4/.015*.45+er24/.035*.55,-1,1);
 let aRel=scale*rel*.14;
 // Derivatives confirm persistence, but do not choose direction.
 let f15=taker(c15),oiPct=null,oiConfirm=0;if(Array.isArray(oi)&&oi.length>3){let a=+oi[0].sumOpenInterest,b=+oi.at(-1).sumOpenInterest;if(a>0){oiPct=(b/a-1)*100;oiConfirm=clamp(Math.abs(oiPct)/1.2,0,1)}}
 let funding=fund&&isFinite(+fund.lastFundingRate)?+fund.lastFundingRate*100:null,crowd=funding==null?0:clamp(Math.abs(funding)/.08,0,1),flow=f15;
 let confirm=clamp(.82+.12*oiConfirm+.10*Math.abs(f15)-.08*crowd,.72,1.05);aFast*=confirm;aSlow*=confirm;
 // Local stretch reduces persistence without forcing reversal.
 let l48=hc.slice(-48).map(Math.log),lm=avg(l48),ls=Math.max(sd(l48),1e-6),zLocal=(Math.log(anchor)-lm)/ls,persist=1-.22*clamp(Math.abs(zLocal)-1,0,2)/2;aFast*=persist;aSlow*=persist;
 let rvNow=Math.max(sd(r1.slice(-48)),1e-6),rvPrev=Math.max(sd(r1.slice(-96,-48)),1e-6),volRatio=clamp(rvNow/rvPrev,.72,1.40);
 // One continuous P50 path. Slow components cannot flip on every refresh.
 let path=[];for(let h=0;h<=24;h++){let mu=h===0?0:integrate(aFast,4.8,h)+integrate(aSlow,12,h)+integrate(aRel,14,h)+integrate(aLong,36,h);let sig=h===0?0:vol1*Math.sqrt(h)*Math.sqrt(1+h/40)*Math.sqrt(volRatio);path.push({h,mu,sig,p50:anchor*Math.exp(mu),up:h===0?.5:phi(mu/Math.max(sig,1e-9))})}
 // Estimated Binance liquidation magnets. Build weighted entry-price bins from recent futures candles,
 // project common leverage liquidation distances, and weight by volume/OI/taker context. This is an estimate, not exchange position data.
 let src=closed(m5).slice(-288);if(src.length<200)throw Error('LIQ DATA ERROR');let lo=Math.min(...src.map(x=>+x[3])),hi=Math.max(...src.map(x=>+x[2])),bin=Math.max(A*.16,anchor*.0015),bins=new Map();
 for(let x of src){let p=(+x[2]+ +x[3]+ +x[4])/3,v=+x[7]||0,k=Math.round(p/bin)*bin;bins.set(k,(bins.get(k)||0)+v)}
 let levels=[];for(let [entry,v] of bins){for(let lev of [10,20,50]){let buffer=lev===10?.092:lev===20?.046:.018;let w=v*(lev===20?1:lev===10?.65:.55)*(1+.18*oiConfirm);levels.push({p:entry*(1+buffer),side:'UP',w});levels.push({p:entry*(1-buffer),side:'DOWN',w})}}
 function cluster(side){let arr=levels.filter(q=>side==='UP'?q.p>live:q.p<live),cm=new Map();for(let q of arr){let k=Math.round(q.p/bin)*bin;cm.set(k,(cm.get(k)||0)+q.w)}let a=[...cm].map(([p,w])=>({p:+p,w}));a.sort((x,y)=>side==='UP'?x.p-y.p:y.p-x.p);let max=Math.max(...a.map(x=>x.w),1),strong=a.filter(x=>x.w>=max*.18);let hit=strong[0]||a[0];if(!hit)throw Error('LIQ DATA ERROR');return hit}
 let upMag=cluster('UP'),dnMag=cluster('DOWN');
 // Boundary paths are liquidation magnets, not P20/P80. As P50 approaches/consumes one, move toward the next estimated cluster.
 function ranked(side){let arr=levels.filter(q=>side==='UP'?q.p>live:q.p<live),cm=new Map();for(let q of arr){let k=Math.round(q.p/bin)*bin;cm.set(k,(cm.get(k)||0)+q.w)}let a=[...cm].map(([p,w])=>({p:+p,w}));a.sort((x,y)=>side==='UP'?x.p-y.p:y.p-x.p);let max=Math.max(...a.map(x=>x.w),1);return a.filter(x=>x.w>=max*.18).slice(0,8)}
 let ups=ranked('UP'),dns=ranked('DOWN');function magnet(arr,center,side){let cand=arr.find(q=>side==='UP'?q.p>center+A*.12:q.p<center-A*.12);if(cand)return cand.p;let edge=arr.at(-1);if(edge)return edge.p;throw Error('LIQ DATA ERROR')}
 for(let q of path){q.upper=magnet(ups,q.p50,'UP');q.lower=magnet(dns,q.p50,'DOWN');if(q.lower>q.p50)q.lower=q.p50-A*.5;if(q.upper<q.p50)q.upper=q.p50+A*.5}
 let targets={},bands={},probs={};for(let h of [4,12,24]){let q=path[h];targets[h]=q.p50;bands[h]={p20:q.lower,p80:q.upper};probs[h]=q.up}
 let pMain=clamp(probs[4]*.45+probs[12]*.35+probs[24]*.20,0,1),dir=pMain>=.5?'LONG':'SHORT',conf=(dir==='LONG'?pMain:1-pMain)*100;
 let spread=(upMag.p-dnMag.p)/anchor,flat=Math.abs(sSlow)<vol1*.10&&Math.abs(sFast)<vol1*.16,marketMode=flat&&spread<.045?'КОНСОЛИДАЦИЯ':dir;
 return {live,anchor,anchorTime,A,dir,conf,pMain,targets,bands,probs,path,er24,er4,oiPct,flow,hist:c1,vol1,ma50,ma200,longReg,zLocal,volRatio,upMag:upMag.p,dnMag:dnMag.p,marketMode,rel};
}
function draw(s){
 let cv=$('chart'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);let x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 const L=12,R=12,T=18,B=28,plotW=w-L-R,plotH=h-T-B,histFrac=.66,xAnchor=L+plotW*histFrac,futW=plotW*(1-histFrac);
 let hist=closes(s.hist).slice(-720);if(!hist.length)return; // append exact 15m anchor so history and forecast physically meet
 if(Math.abs(hist.at(-1)-s.anchor)>.0001)hist=hist.concat([s.anchor]);else hist[hist.length-1]=s.anchor;
 let all=hist.slice();all.push(s.live,s.ma50,s.ma200);for(let q of s.path){all.push(q.lower,q.p50,q.upper)}let mn=Math.min(...all),mx=Math.max(...all),span=Math.max(mx-mn,s.anchor*.004),pad=span*.10,mny=mn-pad,mxy=mx+pad;
 const Y=p=>T+(mxy-p)/(mxy-mny)*plotH, XH=i=>L+(hist.length<=1?0:i/(hist.length-1))*(xAnchor-L), XF=hh=>xAnchor+(hh/24)*futW;
 // grid + future time labels
 x.lineWidth=1;x.strokeStyle='#1d2a3c';for(let i=0;i<=4;i++){let yy=T+i*plotH/4;x.beginPath();x.moveTo(L,yy);x.lineTo(w-R,yy);x.stroke()}
 x.font='11px system-ui';x.fillStyle='#8090a7';x.textAlign='center';for(let hh of [4,12,24]){let xx=XF(hh);x.beginPath();x.moveTo(xx,T);x.lineTo(xx,T+plotH);x.stroke();x.fillText('+'+hh+'ч',xx,h-8)}
 // history
 x.strokeStyle='#8795aa';x.lineWidth=2;x.beginPath();hist.forEach((p,i)=>i?x.lineTo(XH(i),Y(p)):x.moveTo(XH(i),Y(p)));x.stroke();
 // anchor divider
 x.save();x.setLineDash([4,4]);x.strokeStyle='#617087';x.beginPath();x.moveTo(xAnchor,T);x.lineTo(xAnchor,T+plotH);x.stroke();x.restore();
 // thin 50D / 200D regime lines
 x.save();x.setLineDash([5,5]);x.lineWidth=1;for(let [p,label] of [[s.ma50,'50'],[s.ma200,'200']]){let c='#d6b35a';x.strokeStyle=c;x.beginPath();x.moveTo(L,Y(p));x.lineTo(w-R,Y(p));x.stroke();x.fillStyle=c;x.textAlign='left';x.fillText(label,L+4,Math.max(T+11,Math.min(T+plotH-3,Y(p)-3)))}x.restore();
 // estimated liquidation-magnet corridor
 x.beginPath();x.moveTo(XF(0),Y(s.anchor));for(let i=1;i<s.path.length;i++)x.lineTo(XF(s.path[i].h),Y(s.path[i].upper));for(let i=s.path.length-1;i>=1;i--)x.lineTo(XF(s.path[i].h),Y(s.path[i].lower));x.closePath();x.fillStyle='rgba(71,124,255,.12)';x.fill();
 for(let key of ['lower','upper']){x.strokeStyle='#477cff';x.lineWidth=1.5;x.beginPath();x.moveTo(XF(0),Y(s.anchor));for(let i=1;i<s.path.length;i++)x.lineTo(XF(s.path[i].h),Y(s.path[i][key]));x.stroke()}
 x.strokeStyle='#32dc91';x.lineWidth=3;x.beginPath();x.moveTo(XF(0),Y(s.anchor));for(let i=1;i<s.path.length;i++)x.lineTo(XF(s.path[i].h),Y(s.path[i].p50));x.stroke();
 // anchor marker + compact label kept inside chart
 x.fillStyle='#eef4ff';x.beginPath();x.arc(xAnchor,Y(s.anchor),3.5,0,Math.PI*2);x.fill();x.font='11px system-ui';x.textAlign='right';x.fillStyle='#cbd7e8';x.fillText('ANCHOR '+fmt(s.anchor),xAnchor-7,Math.max(T+12,Y(s.anchor)-7));
 // LIVE is the current market price after the closed-candle anchor. It is displayed separately and never moves the forecast path.
 let liveH=clamp((Date.now()-s.anchorTime)/3600000,0,.5),xLive=XF(liveH),yLive=Y(s.live);x.fillStyle='#ffc966';x.beginPath();x.arc(xLive,yLive,4,0,Math.PI*2);x.fill();x.textAlign='left';x.fillStyle='#ffc966';x.fillText('LIVE '+fmt(s.live),Math.min(xLive+7,w-92),Math.max(T+12,yLive-7));
}
function render(s){window._s=s;$('price').textContent=fmt(s.live);$('signal').className='sig '+(s.dir==='LONG'?'long':'short');$('signal').textContent=`${s.dir==='LONG'?'🟢':'🔴'} ETH TUNNEL ${s.dir} · ${s.conf.toFixed(1)}%`;$('state').textContent=`Одна математика · ANCHOR ${new Date(s.anchorTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;for(let h of [4,12,24]){$('p'+h).textContent=fmt(s.targets[h]);let up=s.probs[h],p=s.targets[h]>=s.anchor?up:1-up;$('q'+h).textContent=`${s.targets[h]>=s.anchor?'LONG':'SHORT'} ${(p*100).toFixed(1)}% · LIQ ${fmt(s.bands[h].p20)} ↔ ${fmt(s.bands[h].p80)}`}$('ethbtc').textContent=(s.er24>=0?'↑ ':'↓ ')+(s.er24*100).toFixed(2)+'% / 24ч'+(s.rel?` · ВЛИЯЕТ`:' · нейтр.');$('flow').textContent=`FLOW ${s.flow>=0?'+':''}${s.flow.toFixed(2)} · OI ${s.oiPct==null?'—':(s.oiPct>=0?'+':'')+s.oiPct.toFixed(2)+'%'}`;$('regime').textContent=`50D ${fmt(s.ma50)} · 200D ${fmt(s.ma200)}${Math.abs(s.longReg)>.28?' · ВЛИЯЕТ':''}`;$('liq').textContent=`↓ ${fmt(s.dnMag)} · ↑ ${fmt(s.upMag)}`;$('volstate').textContent=`Z ${s.zLocal>=0?'+':''}${s.zLocal.toFixed(2)} · σ ${s.volRatio>1.05?'расширяется':s.volRatio<.95?'сжимается':'стабильна'}`;$('marketmode').textContent=s.marketMode;{let ups=[s.bands[4].p80,s.bands[12].p80,s.bands[24].p80].filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>.5);let dns=[s.bands[4].p20,s.bands[12].p20,s.bands[24].p20].filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>.5);$('rotation').textContent=`Туннель сейчас: ↓ ${dns.map(fmt).join(' → ')} · ↑ ${ups.map(fmt).join(' → ')}`;}$('warn').textContent='';draw(s);$('status').textContent='Live '+new Date().toLocaleTimeString()}
async function load(){try{$('status').textContent='Получаю рынок…';render(await compute())}catch(e){$('status').textContent='Ошибка данных: '+e.message;console.error(e)}}window.addEventListener('resize',()=>window._s&&draw(window._s));load();
</script></body></html>
